  # ==== REVISION / ORTHOGONAL-INTEGRATION QC ====
  - result_id: R_QC_scvi_vs_harmony
    question: Does an orthogonal integration method (scVI) reproduce Harmony batch-mixing and bio-preservation on the same 60k-cell subsample?
    modality: scRNA-seq (integrated atlas, n=60,000 cells, 7 datasets)
    comparison: scVI (n_latent=30, 25 epochs, CPU) vs Harmony vs uncorrected PCA
    inputs:
      - data/processed/integrated_io_atlas.h5ad (layers/counts)
    sample_unit: cell (within atlas)
    statistical_method: ASW, iLISI, cLISI, kBET (scib helpers)
    covariates: batch_key=dataset, label_key=cell_type
    multiple_testing: none (descriptive QC)
    main_outputs:
      - out/01_preprocessing/tables/scvi_vs_harmony_metrics.csv
      - out/01_preprocessing/tables/batch_effect_metrics.csv (scVI row appended)
      - out/01_preprocessing/figures/01d_scvi_umap.png
      - out/01_preprocessing/figures/01d_scvi_metric_bars.png
    qc_status: pass
    effect_size:
      scVI_asw_batch: 0.478
      scVI_iLISI_median: 1.65
      scVI_cLISI_median: 2.47
      scVI_kBET_accept: 1.00
      Harmony_asw_batch: 0.472
      Harmony_iLISI_median: 2.07
    significance: n/a
    interpretation_status: supported
    strength_class: supported_limited
    manuscript_priority: supplement
    figure_candidate: S01d_scvi_vs_harmony
    caveats:
      - Run on 60k-cell subsample (not full 1.06M) due to CPU-only driver mismatch.
      - scVI ≈ Harmony on ASW-batch (0.478 vs 0.472); Harmony retains slightly better iLISI (2.07 vs 1.65).
      - Supports conclusion that integration choice does not qualitatively alter downstream structure.

  # ==== REVISION / CNV MECHANISTIC CHAIN ====
  - result_id: R_L1_cnv_chain
    question: Do CNV diversity, chromosome-arm losses, inflammation pathways, and spatial programme activity form a coherent responder-linked chain?
    modality: scRNA-seq (CNV atlas) + spatial (GSE238264 + GSE281759)
    comparison: R vs NR across 7 chained steps (clone diversity, CNV-SD, chr-arm deltas, pathway BH, NF-κB split, spatial NMF3 activity, spatial stromal-hepatocyte neighbourhood)
    inputs:
      - out/05_multilayer/tables/cnv_response_stats.csv
      - out/05_multilayer/tables/cnv_bin_response_stats.csv
      - out/05_multilayer/tables/cnv_pathway_enrichment.csv
      - out/05_multilayer/tables/nmf_programs_spatial_activity.csv
      - out/05_multilayer/tables/cnv_patient_trajectory.csv
    sample_unit: patient (CNV) / spot (spatial)
    statistical_method: Mann-Whitney U; BH-FDR; Spearman ρ
    covariates: cohort (discovery only)
    multiple_testing: BH across bins/pathways
    main_outputs:
      - out/05_multilayer/tables/cnv_chain_summary.csv
      - out/05_multilayer/figures/05h_cnv_chain.png
      - out/05_multilayer/figures/05h_cnv_chain.pdf
    qc_status: pass
    effect_size:
      clone_diversity_cliff_delta: -0.47
      cnv_sd_cliff_delta: -0.48
      hallmark_IFNG_response_BH: 0.128
      nmf3_spatial_rho: 0.42
      stromal_hepatocyte_rho: 0.37
    significance:
      clone_diversity_p: 0.288
      cnv_sd_p: 0.318
      nmf3_spatial_p: 0.040
      stromal_hepatocyte_p: 0.079
    interpretation_status: supported
    strength_class: likely_artifact
    active_reframe_version: "2026-04-21"
    manuscript_priority: main (Fig 3 revision candidate)
    figure_candidate: F3_revised_cnv_chain
    caveats:
      - Small R group (n=7); all CNV R-vs-NR metrics are non-significant (p≥0.29 in current data).
      - CNV-IFNγ pathway enrichment is also non-significant (BH=0.128); chr5 is the only chromosome with any BH<0.10 bins (8.3%).
      - CNV clone_diversity correlates with NMF3 (rho=0.42, p=0.040) and stromal-hepatocytes (rho=0.37, p=0.079) but these are weak links.
      - Spatial links are correlative across patient-aggregated activity, not causal.
      - This chain is now entirely exploratory; it should not be used as a main claim.

