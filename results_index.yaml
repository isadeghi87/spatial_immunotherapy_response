# results_index.yaml — global analytical contract
# Governed by analysis_standards.md (reproducibility, QC, claim control).
# All numeric values sourced from tables under out/**/tables/. Do not edit manually
# without updating the underlying table.
#
# Schema (per entry):
#   result_id, question, modality, comparison, inputs, sample_unit,
#   statistical_method, covariates, multiple_testing, main_outputs,
#   qc_status, effect_size, significance, interpretation_status,
#   strength_class, manuscript_priority, figure_candidate, caveats.
# strength_class ∈ {strong, supported_limited, exploratory, null, inconclusive, likely_artifact}

schema_version: "1.0"
project: spatial_immunotherapy_response
last_updated: 2026-05-17

results:

  # ==== L1 TUMOUR-INTRINSIC / CNV ====
  - result_id: R_L1_cnv_clone_diversity
    question: Does intra-tumour CNV clone diversity differ between Responders and Non-Responders?
    modality: scRNA-seq (CNV atlas, ~48k cells)
    comparison: R (n=7) vs NR (n=17), GSE206325 discovery cohort
    inputs:
      - data/processed/integrated_io_atlas_cnv.h5ad
    sample_unit: patient
    statistical_method: Mann-Whitney U (two-sided)
    covariates: none
    multiple_testing: none applied across the 3 CNV metrics (see caveat)
    main_outputs:
      - out/05_multilayer/tables/cnv_response_stats.csv
      - out/05_multilayer/figures/05a_cnv_RvsNR.png
    qc_status: passed (patient-preserving CNV subsample; reference = non-tumour immune/stromal)
    effect_size: "Cliff's delta = -0.47 (NR > R)"
    significance: "U=42, p=0.288"
    interpretation_status: supported
    strength_class: exploratory
    active_reframe_version: "2026-04-21"
    manuscript_priority: main
    figure_candidate: Figure2
    caveats:
      - small cohort (n=24)
      - BH across {mean, sd, clone_diversity} not applied; with m=3 correction p_BH ≈ 0.079
      - CNV calling from expression (InferCNV) — not DNA-confirmed

