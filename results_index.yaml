# ==========================================================================
# REFRAME (2026-04-21): IMMUNE-ECOLOGY RE-CENTERING
# ----------------------------------------------------------------------
# CNV is NO LONGER the narrative anchor. Thesis is re-centered on an
# immune-active intratumoural ecology (CD8 dysfunction/activation + a
# Tfh/plasma/TLS-linked programme) with explicit separation of discovery-
# only signals from transferable findings.
#
# Allowed strength_class values (declared in analysis_standards §Claim control
# and enforced across this file):
#   strong, supported_limited, exploratory, null, inconclusive, likely_artifact
# All prior off-schema labels have been mapped into the six allowed values
# above (low-effect items -> null or exploratory; null-effect items -> null;
# near-threshold null items -> null). Legacy entries that have been superseded carry
#   superseded_by: <active_result_id>
#   active_reframe_version: "2026-04-21"
# so downstream tooling can always resolve the current canonical status.
# ==========================================================================
reframe_2026_04_21:

  # ---- Reconciliation ----
  - result_id: R_REFRAME_unit_reconciliation
    question: Reconcile patient vs sample vs section units across all cohorts; resolve n=24 vs n=56 ambiguity.
    modality: meta-audit
    comparison: cross-cohort unit reconciliation (GSE206325, Cappuyns2023, IMbrave150, GSE238264, GSE281759)
    inputs:
      - data/processed/GSE206325_sample_annotations.csv
      - out/05_multilayer/tables/patient_multilayer_features.csv
      - out/02i_cappuyns_signatures/tables/patient_level_cappuyns_scores.csv
      - out/04_complementary/tables/revision_imbrave150_cd8_arm.csv
    sample_unit: patient (scRNA) / section (Visium) / patient (IMbrave150)
    statistical_method: descriptive audit (no inferential test)
    covariates: n/a
    multiple_testing: n/a
    main_outputs:
      - out/06_reframe/tables/cohort_unit_reconciliation.csv
      - out/06_reframe/tables/gse206325_patient_audit.csv
      - out/06_reframe/notes/cohort_unit_reconciliation.md
    qc_status: pass
    effect_size:
      GSE206325_raw_patients: 29
      GSE206325_labelled_patients: 28
      GSE206325_retained_discovery: 24  # (17 NR / 7 R; dropped 15, 63, 71, 98 for low cell yield; 1024 unlabelled)
      Cappuyns2023_patients: 32
      pooled_size: 56
      IMbrave150_trial_patients: 177    # 119 Atezo+Bev (60 CD8-high + 59 CD8-low) + 58 Sorafenib (29 + 29)
      GSE238264_sections: 7             # 4R / 3NR
    significance: n/a (descriptive)
    interpretation_status: supported
    strength_class: strong
    manuscript_priority: methods
    figure_candidate: F1_cohort_overview
    caveats:
      - The n=56 figure applies to the POOLED discovery+Cappuyns set (24+32), not to GSE206325 alone; any prior wording attributing all 56 units to GSE206325 is a bookkeeping error and is withdrawn.
      - Earlier reconciliation listed IMbrave150 as n=4 because the script counted the four arm×endpoint summary rows; the correct trial cohort is 177 patients.
      - All R-vs-NR inference from here onwards is patient-level for scRNA and section-level for Visium; cell-level/spot-level p-values are treated as exploratory only.

  # ---- Discovery (GSE206325): locked immune-module panel ----
  - result_id: R_REFRAME_discovery_modules
    question: Which patient-level immune modules (locked panel, platform-measurable) are associated with response in GSE206325 after BH correction within the module family?
    modality: scRNA-seq, patient-level
    comparison: R (n=7) vs NR (n=17), GSE206325 discovery cohort
    inputs:
      - out/05_multilayer/tables/patient_multilayer_features.csv
      - out/05_multilayer/tables/nmf_programs_patient_activity.csv
    sample_unit: patient
    statistical_method: Mann–Whitney U + rank-biserial effect size
    covariates: none
    multiple_testing: BH-FDR across the 14 locked modules
    main_outputs:
      - out/06_reframe/tables/discovery_module_associations.csv
      - out/06_reframe/tables/discovery_module_correlation.csv
      - out/06_reframe/tables/discovery_module_redundancy.csv
      - out/06_reframe/tables/discovery_top5_rho_matrix.csv
      - out/06_reframe/tables/discovery_top5_axis_pairs.csv
      - out/06_reframe/tables/discovery_top5_axis_summary.csv
      - out/06_reframe/tables/discovery_immune_axis_pc1.csv
      - out/06_reframe/tables/discovery_immune_axis_pc1_loadings.csv
    qc_status: pass
    effect_size:
      M_plasma_proxy_NMF10: rb=+0.849
      M_Tfh:                rb=+0.832
      M_TLS:                rb=+0.832
      M_CD8_dysfunction:    rb=+0.782
      M_Immune_checkpoint:  rb=+0.748
      M_CD8_activation:     rb=+0.580  # suggestive, not BH-significant
      top5_rho_all_range:    "0.624 to 0.993 (n_pairs=10, median=0.896)"
      core4_rho_range:       "0.888 to 0.993 (core4 = CD8_dysfunction, Tfh, TLS, Immune_checkpoint; n_pairs=6, median=0.937)"
      plasma_vs_core4_rho:   "0.624 to 0.770 (n_pairs=4, median=0.637)"
      immune_axis_PC1_variance_explained: see discovery_immune_axis_pc1_loadings.csv
    significance:
      M_plasma_proxy_NMF10: p_BH=0.0036
      M_Tfh:                p_BH=0.0036
      M_TLS:                p_BH=0.0036
      M_CD8_dysfunction:    p_BH=0.0066
      M_Immune_checkpoint:  p_BH=0.0091
      M_CD8_activation:     p_BH=0.066
    interpretation_status: supported
    strength_class: supported_limited
    manuscript_priority: main_and_supplement
    figure_candidate: F2_discovery_immune_axis
    caveats:
      - "The top-5 BH-strong modules do NOT collapse into a single rho>0.9 axis. The true geometry is a tight CORE-4 block (CD8_dysfunction, Tfh, TLS, Immune_checkpoint; pairwise rho 0.888–0.993) plus M_plasma_proxy, which is partially aligned (rho 0.624–0.770 against the core-4). Manuscript wording must describe one core immune-active axis with a plasma/TLS-linked satellite, not a fully collapsed single axis."
      - "Discovery-only; no module survives transfer (see R_REFRAME_cappuyns_transfer). Claim is BOUNDED to GSE206325 discovery cohort."
      - "n=24 (7R/17NR) is small; patient-level test is defensible but power is limited."

  # ---- Cappuyns locked-module transfer ----
  - result_id: R_REFRAME_cappuyns_transfer
    question: Do the locked immune modules transfer to Cappuyns2023 with concordant sign and effect?
    modality: scRNA-seq cross-cohort transfer
    comparison: R (n=19) vs NR (n=13) in Cappuyns2023; dynamic-range check + sign concordance vs GSE206325 discovery
    inputs:
      - out/05_multilayer/tables/patient_multilayer_features.csv
    sample_unit: patient
    statistical_method: Mann–Whitney U, rank-biserial, Q5–Q95 range overlap, sign-concordance with discovery
    covariates: none (cross-cohort transfer check)
    multiple_testing: BH-FDR across the 14 locked modules
    main_outputs:
      - out/06_reframe/tables/cappuyns_locked_transfer.csv
    qc_status: pass
    effect_size:
      transfer_pass_rate: 0/14 modules survive BH<0.10
      sign_concordance_strong_modules:
        M_Tfh:               sign_flipped
        M_CD8_dysfunction:   sign_flipped
        M_Immune_checkpoint: sign_flipped
        M_TLS:               sign_concordant (NS, rb=+0.31)
        M_plasma_proxy:      sign_concordant (NS, rb=+0.17)
      dynamic_range_all_adequate: true
    significance:
      best_BH: 0.51
    interpretation_status: null_finding
    strength_class: null
    manuscript_priority: main_and_supplement
    figure_candidate: F3_transfer_failure_and_composition
    caveats:
      - This is the critical null result of the reframe. No discovery module reaches BH<0.10 in Cappuyns; three of the top-5 discovery modules flip sign.
      - Dynamic range is adequate in all 14 modules → this is NOT a measurement failure; it is a true non-transfer of the discovery biology.
      - Under the reframe, the earlier framing that described the discovery modules as a cross-cohort-validated immune signature is withdrawn.

  # ---- Pooled sensitivity with cohort term ----
  - result_id: R_REFRAME_pooled_sensitivity
    question: When GSE206325 and Cappuyns are pooled with a cohort covariate, which module effects survive cohort adjustment?
    modality: pooled scRNA-seq logit (n=56)
    comparison: R (n=26) vs NR (n=30) pooled, cohort as covariate
    inputs:
      - out/05_multilayer/tables/patient_multilayer_features.csv
    sample_unit: patient (cohort as covariate)
    statistical_method: logistic regression (standardized module + cohort binary) with delta-AIC vs cohort-only
    covariates: cohort (GSE206325 vs Cappuyns2023)
    multiple_testing: BH-FDR across the 14 modules
    main_outputs:
      - out/06_reframe/tables/pooled_sensitivity_cohort_adjusted.csv
      - out/06_reframe/tables/pooled_sensitivity_module_x_cohort.csv
    qc_status: pass
    effect_size:
      modules_significant_after_BH: 0
      modules_with_cohort_larger_than_module_beta: 6  # M_Tfh, M_plasma_proxy, M_TLS, M_Immune_checkpoint, M_CD8_dysfunction, M_WNT
      modules_cohort_dominated: 5                     # M_CD8_activation, M_Angiogenesis, M_Macrophage_M2, M_TGFbeta, M_Treg
      only_non_cohort_dominated:
        M_CD8_progenitor: "neg, p_BH=0.087"
        M_mregDC:         "neg, p_BH=0.087"
      module_x_cohort_interaction_LRT:
        M_TLS:             "p=0.0047, BH=0.065 (attenuated 5.76->0.60 from GSE206325 to Cappuyns)"
        M_Tfh:             "p=0.015,  BH=0.108 (attenuated 3.34->0.23)"
        M_CD8_dysfunction: "p=0.036,  BH=0.166 (attenuated 2.03->0.17)"
        interpretation: "effect MAGNITUDE collapses between cohorts for the core-axis modules; the additive pooled model is therefore not a safe effect estimator"
    significance: no p_BH < 0.05 (any module, after cohort adjustment)
    interpretation_status: supported  # supported interpretation: pooled signal is cohort-driven
    strength_class: likely_artifact   # any "pooled significance" is a cohort signature, not a biology signature
    manuscript_priority: supplement
    figure_candidate: S_pooled_cohort_dominance
    caveats:
      - Under the reframe, pooled-model "significance" is re-classified as cohort-driven. No claim of cross-cohort biological effect may be built from this table.
      - The formal module x cohort interaction sensitivity (LRT) shows significant attenuation of the core-axis modules M_TLS (p=0.005), M_Tfh (p=0.015) and M_CD8_dysfunction (p=0.036) between GSE206325 and Cappuyns. This confirms the additive pooled model is a cautionary sanity check, not a biological effect estimator.

  # ---- NMF10 re-framing: plasma/Ig programme, not independent ----
  - result_id: R_REFRAME_nmf10_plasma_adjusted
    question: Does the NMF10 response association survive adjustment for plasma-cell composition?
    modality: scRNA-seq patient-level (GSE206325 discovery + pooled sensitivity)
    comparison: NMF10 activity vs response, with and without adjustment for frac_B_Plasma
    inputs:
      - out/05_multilayer/tables/patient_multilayer_features.csv
      - out/05_multilayer/tables/nmf_programs_patient_activity.csv
    sample_unit: patient
    statistical_method: Spearman correlation + plasma-frac residualisation; logistic regression with frac_B_Plasma as covariate
    covariates: frac_B_Plasma
    multiple_testing: n/a (single programme, directed hypothesis)
    main_outputs:
      - out/06_reframe/tables/nmf10_plasma_reframe.csv
    qc_status: pass
    effect_size:
      discovery_naive_spearman: 0.669
      discovery_plasma_adjusted_spearman: 0.205  # association collapses
      discovery_logit_beta_NMF10_with_plasma: near zero
      pooled_logit_beta_NMF10_with_plasma: retained only because Cappuyns frac_B_Plasma is structurally zero → adjustment uninformative
    significance:
      discovery_naive_p: 3.5e-4
      discovery_adjusted_p: 0.336
      discovery_logit_p_NMF10_with_plasma: 0.962
      pooled_logit_p_NMF10_with_plasma: 0.070
    interpretation_status: supported  # adjusted picture is defensible
    strength_class: likely_artifact   # original NMF10-is-independent claim is composition-driven
    manuscript_priority: main_and_supplement
    figure_candidate: F3_transfer_failure_and_composition
    caveats:
      - The earlier claim that NMF10 is an independent plasma/IG programme unexplained by plasma-cell abundance is WITHDRAWN. The discovery NMF10–response association is no longer supported after plasma adjustment (residualised rho 0.67→0.21, p=0.34; logit p_NMF10=0.96 when frac_B_Plasma is a covariate).
      - The pooled logit apparent "survival" (p_NMF10=0.07) is an illustration of why cross-platform adjustment is not informative here — frac_B_Plasma is structurally zero in Cappuyns — not evidence for an NMF10 effect beyond plasma composition.

  # ---- Spatial GSE238264 — niche localization + section-level LOSO ----
  - result_id: R_REFRAME_spatial_modules_LOSO
    question: Where in tissue do the locked immune modules localize, and are section-level R-vs-NR differences robust to leave-one-section-out?
    modality: Visium (GSE238264, n=7 sections, 4R / 3NR)
    comparison: R (n=4 sections) vs NR (n=3 sections); within-section spot-level co-localization
    inputs:
      - data/spatial_data/GSE238264_HCC_IO_Visium/
      - out/05_multilayer/tables/nmf_programs_gene_loadings.csv
    sample_unit: section (inferential); spot (descriptive niche coherence only)
    statistical_method: section-level module score + exact permutation p (C(7,4)=35) + LOSO sensitivity; spot-level Spearman niche-coherence
    covariates: none
    multiple_testing: none at section level (n_modules=8, exploratory only; max LOSO p reported per module)
    main_outputs:
      - out/06_reframe/tables/spatial_modules_per_section.csv
      - out/06_reframe/tables/spatial_RvsNR_section_level_LOSO.csv
      - out/06_reframe/tables/spatial_niche_coherence.csv
      - out/06_reframe/tables/spatial_modules_per_spot.csv.gz
    qc_status: pass_with_caveats
    effect_size:
      exploratory_borderline_modules:
        CD8_dysfunction:      "mean_R=-0.008, mean_NR=-0.000, sign-stable under LOSO"
        Antigen_presentation: "mean_R=+1.02,  mean_NR=+0.47,  sign-stable under LOSO"
      section_not_supported: [Tfh, Plasma, TLS, Immune_checkpoint, Stromal_Hepatocyte, CD8_activation]
      niche_coherence_median_rho_across_sections:
        CD8_dysfunction_vs_TLS: 0.12
        Tfh_vs_Plasma:          0.04
        TLS_vs_Plasma:          0.06
        Stromal_Hep_vs_Plasma: -0.01
    significance:
      CD8_dysfunction:      "p_section=0.057, LOSO_p_max=0.133, fraction_LOSO_p<0.10 = 0.00"
      Antigen_presentation: "p_section=0.057, LOSO_p_max=0.100, fraction_LOSO_p<0.10 = 0.43"
      all_other_modules:    "p_section >= 0.20 OR LOSO sign unstable"
    interpretation_status: exploratory
    strength_class: exploratory
    manuscript_priority: supplement
    figure_candidate: S_spatial_modules_LOSO
    caveats:
      - "n=7 sections (4R/3NR). Only CD8_dysfunction and Antigen_presentation reach borderline exact-permutation p<0.10 with sign-stable LOSO; maximum-LOSO p rises to 0.10–0.13. This is EXPLORATORY / BORDERLINE support at best, not section-level supported."
      - HCC2R section (T3.1 spot-QC pass=43.6%) is a declared QC outlier; LOSO is the safety net.
      - Niche coherence (spot-level Spearman between modules within each section) is small (median rho 0.00–0.12). The immune-active modules are NOT strongly co-localized at Visium resolution. Any "TLS niche" claim must be section-level compositional, not spot-level co-expression.
      - No spatial R-vs-NR classification claim may be built from n=7 sections; spatial support is descriptive localization only.

  # ---- IMbrave150 orthogonal support, strict boundaries ----
  - result_id: R_REFRAME_imbrave150_orthogonal
    question: Does IMbrave150 support immune-active benefit on Atezo+Bev, and does CD8-high show a differential benefit between arms?
    modality: bulk RNA + survival (IMbrave150, n=177 patients)
    comparison: CD8-high vs CD8-low within each arm (Atezo+Bev n=119; Sorafenib n=58) + arm×CD8 interaction
    inputs:
      - out/04_complementary/tables/revision_imbrave150_cd8_arm.csv
      - out/04_complementary/tables/revision_imbrave150_cox_interaction.csv
    sample_unit: patient
    statistical_method: within-arm log-rank + Cox proportional hazards with arm × CD8-high interaction
    covariates: arm, CD8-high (in Cox); none in within-arm log-rank
    multiple_testing: none applied across the 2 endpoints (PFS, OS); interpretation is pre-specified endpoint-by-endpoint
    main_outputs:
      - out/06_reframe/tables/imbrave150_orthogonal_support.csv
    qc_status: pass
    effect_size:
      AtezoBev_PFS_CD8high_vs_low_median_mo: "8.4 vs 5.6"
      Sorafenib_PFS_CD8high_vs_low_median_mo: "4.23 vs 5.17"
      arm_x_CD8_interaction_PFS_HR: "0.571 (95% CI 0.252–1.298)"
      arm_x_CD8_interaction_OS_HR:  "0.356 (95% CI 0.119–1.068)"
    significance:
      AtezoBev_PFS_logrank_p: 0.00900
      Sorafenib_PFS_logrank_p: 0.89935
      arm_x_CD8_interaction_PFS_p: 0.1814
      arm_x_CD8_interaction_OS_p: 0.0653
    interpretation_status: supported_with_boundary
    strength_class: supported_limited
    manuscript_priority: main_and_supplement
    figure_candidate: F4_imbrave150_orthogonal
    caveats:
      - Within-arm benefit of CD8-high on Atezo+Bev is defensible (PFS log-rank p=0.009) — orthogonal support for "immune-active patients do better on this combination".
      - The arm × CD8-high interaction is NOT statistically significant for PFS (p=0.18) and only suggestive for OS (p=0.065). A differential-benefit claim for CD8-high between arms is not supported — the earlier wording is withdrawn.
      - This is orthogonal within-arm support, not predictive validation of the reframe.

# ==========================================================================
# RECLASSIFICATION OF EARLIER HEADLINE RESULTS UNDER THE REFRAME
# ----------------------------------------------------------------------
# Canonical source of truth for strength_class of legacy result_ids.
# Allowed values: strong, supported_limited, exploratory, null,
# inconclusive, likely_artifact. Each legacy entry whose strength is
# changed here also carries superseded_by / active_reframe_version in its
# own record so downstream tooling resolves one active status per result.
# ==========================================================================
reframe_reclassification:
  R_L1_cnv_chain:                   exploratory           # all CNV R-vs-NR metrics now non-significant (p>=0.29); chain is descriptive only
  R_L1_cnv_chromosome_arm:          exploratory           # chr5 only has any BH<0.10 bins; retained as descriptive detail
  R_L1_cnv_pathway_enrichment:      null                  # IFN-gamma BH=0.128, not significant; pathway enrichment is null
  R_L1_cnv_bins_responder_gained:   exploratory           # some chr5 bins survive BH; weak signal
  R_L1_cnv_clone_diversity:         null                  # p=0.288 — non-significant; downgraded from exploratory
  R_L1_cnv_score_sd:                null                  # p=0.318 — non-significant
  R_L1_cnv_pathway_IFNG:            null                  # BH=0.128 — not significant
  R_T2_3_cnv_exhaustion_mediation:  exploratory           # already flagged; remains
  R_L2_regulon_layer_auc:           null                  # near-null, retained for honesty
  R_L3_composition_discovery:       supported_limited     # discovery AUC=0.983; not transferable
  R_L3_composition_noTech:          supported_limited
  R_VAL_L3:                         null                  # val AUC=0.611, CI crosses 0.5, driven by 2-3 outliers
  R_VAL_L5:                         null                  # val AUC=0.506, CI straddles 0.5
  R_VAL_ensemble:                   null                  # val AUC=0.482 — below chance
  R_ensemble_discovery:             supported_limited     # discovery AUC=0.933; discovery-only
  R_ensemble_coefficients:          supported_limited
  R_L4_io_signatures_discovery:     supported_limited     # subsumed by R_REFRAME_discovery_modules
  R_L5_nmf_discovery:               supported_limited     # disc AUC=0.731
  R_L5_NMF10_BH:                    null                  # no NMF program BH-significant after correction (NMF4 p_BH=0.199); prior claim withdrawn
  R_L5_NMF10_transfer_diag:         exploratory           # composition-explained; demoted from supported
  R_L5_NMF10_cappuyns_transfer:     likely_artifact       # pooled NMF10 survives only because of zero Cappuyns plasma-frac
  R_L2_spatial_gse238264_RvsNR:     exploratory           # demoted; n=7 sections cannot anchor R-vs-NR claim
  R_complementary_immune_ratios:    null                  # all AUC < 0.5; retained
  R_TRIAL_imbrave150_cox:           null                  # interaction null (PFS p=0.18, OS p=0.065); superseded_by R_REFRAME_imbrave150_orthogonal
  R_T2_1_stratified_permutation:    supported_limited
  R_T3_2_lasso_C_sensitivity:       exploratory           # robustness ok but the underlying model is now null on transfer

# ==========================================================================
# STRONG / DEFENSIBLE CLAIMS UNDER THE REFRAME (max 5)
# ----------------------------------------------------------------------
# Spatial claim removed from this list under the reframe (effect size and
# section count do not meet the defensible-claim ceiling); it remains
# documented in R_REFRAME_spatial_modules_LOSO as exploratory and in supplement.
# ==========================================================================
reframe_defensible_claims:
  - claim: "In the GSE206325 discovery cohort (n=24, 7R/17NR), Responders show a coherent immune-active state — a tight CORE-4 axis of CD8 dysfunctional/exhaustion, Tfh-like, TLS and immune-checkpoint modules (pairwise rho 0.888–0.993) with a partially aligned plasma/NMF10 satellite (rho 0.624–0.770 against the core)."
    evidence: [R_REFRAME_discovery_modules]
    strength_class: supported_limited
    boundary: Discovery-only, n=24, patient-level; describe as one core axis + plasma-linked satellite, not a single fully collapsed axis.

  - claim: "This discovery axis does not transfer to Cappuyns2023 at BH<0.10 (best BH≈0.51); three of the top five discovery modules flip sign, despite adequate dynamic range in all 14 modules. The prior framing of the discovery modules as a cross-cohort-validated immune signature is withdrawn."
    evidence: [R_REFRAME_cappuyns_transfer]
    strength_class: null
    boundary: Honest null finding; must be preserved in Results.

  - claim: "The previously reported cell-fraction Layer-3 predictor and multi-layer ensemble are not transferable (L3 AUC=0.50 on Cappuyns; ensemble AUC≈0.58 at the headline C); the collapse is not a regularisation artefact."
    evidence: [R_VAL_L3, R_VAL_ensemble, R_T3_2_lasso_C_sensitivity]
    strength_class: null
    boundary: Null finding; fractions are atlas-specific.

  - claim: "The NMF10 response association in GSE206325 is no longer supported after plasma adjustment (residualised Spearman 0.67→0.21, p=0.34; logit p_NMF10=0.96 with frac_B_Plasma as covariate). NMF10 should be retained as a descriptive plasma/TLS-linked marker, not an independent programme."
    evidence: [R_REFRAME_nmf10_plasma_adjusted]
    strength_class: likely_artifact
    boundary: The prior claim that NMF10 is response-associated independently of plasma abundance is withdrawn; pooled logit "survival" is an artefact of structurally-zero plasma-frac in Cappuyns.

  - claim: "IMbrave150 (n=177; 119 Atezo+Bev + 58 Sorafenib) provides orthogonal within-arm support that CD8-high patients gain PFS on Atezo+Bev (8.4 vs 5.6 mo, log-rank p=0.009), but the arm × CD8 interaction is not significant (PFS p=0.18, OS p=0.065). CD8-high is therefore prognostic within the Atezo+Bev arm, not a marker of differential benefit between arms."
    evidence: [R_REFRAME_imbrave150_orthogonal]
    strength_class: supported_limited
    boundary: Orthogonal within-arm support; NOT differential-benefit validation between arms.

# ==========================================================================
# NULL FINDINGS THAT MUST STAY IN THE STORY
# ==========================================================================
reframe_preserved_nulls:
  - R_VAL_L3                         # Layer-3 cell-fraction transfer fails (0 features survive in Cappuyns)
  - R_VAL_ensemble                   # Ensemble transfer AUC drops to ~0.58 at the headline C
  - R_REFRAME_cappuyns_transfer      # locked modules do not transfer
  - R_complementary_immune_ratios    # classical CD8:Treg / M1:M2 ratios are near chance
  - R_L2_regulon_layer_auc           # regulon layer near-null
  - R_T2_3_cnv_exhaustion_mediation  # underpowered, indirect 95% CI includes zero
  - R_L2_spatial_gse238264_RvsNR     # insufficient section-level power for R-vs-NR classification
  - R_REFRAME_imbrave150_orthogonal  # interaction null (no differential benefit between arms)
  - R_TRIAL_imbrave150_cox           # underlying interaction test remains null

# ==========================================================================
# CLAIMS THAT MUST BE REMOVED FROM THE MANUSCRIPT
# ==========================================================================
reframe_removed_claims:
  - CNV as the main driver of response, or as the anchor of a causal CNV→exhaustion→response chain.
  - Multi-layer ensemble presented as a generalizable biomarker.
  - 'Validated cross-cohort immune signature based on Cappuyns transfer of raw features.'
  - NMF10 described as a programme whose response-association is independent of plasma-cell abundance.
  - CD8-high framed as conferring differential PFS/OS benefit on Atezo+Bev vs Sorafenib.
  - Spatial responder-vs-non-responder classification from n=7 Visium sections.
  - Any wording that attributes the pooled n=56 unit count to GSE206325 alone.
  - Cell-level or spot-level p-values used as primary evidence for R-vs-NR claims.
  - Cherry-picked single-section spatial exemplars selected for visual impact.

