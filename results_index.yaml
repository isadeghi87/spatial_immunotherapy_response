# ==========================================================================
# 2026-05-05 SAMPLE-PREVALENCE AUDIT (per-analysis carrier proportions)
# ==========================================================================
# Adds a uniform "what proportion of patients show the effect, and how do they
# differ?" view across analyses. Helper: scripts/_shared/sample_prevalence.py.
# ==========================================================================

  - result_id: R_PREVALENCE_multilayer_features
    question: For each top L1–L5 patient-level feature, what fraction of patients carries the effect (Q3 cutoff), and how do carriers differ on other layers?
    modality: integrated patient-level features (GSE206325 discovery, n=24)
    comparison: carrier (≥Q3) vs other within each L1–L5 feature; plus carrier-vs-other Mann–Whitney across orthogonal properties
    inputs:
      - out/05_multilayer/tables/patient_multilayer_features.csv
    sample_unit: patient
    statistical_method: quantile thresholding + Mann–Whitney U (carrier vs other)
    covariates: response (group breakdown), dataset
    multiple_testing: none — prevalence is descriptive and per-feature; effect-size matrix is for visualisation
    main_outputs:
      - out/05_multilayer/tables/05a_multilayer_prevalence.csv
      - out/05_multilayer/figures/05a_multilayer_prevalence.png
    qc_status: pending_run
    interpretation_status: pending
    strength_class: exploratory
    manuscript_priority: supplement
    figure_candidate: S_prevalence_multilayer
    caveats:
      - Q3 carrier definition is descriptive, not a clinical cutoff.
      - With n=24 discovery patients, per-feature carrier counts are small; treat per-property comparisons as hypothesis-generating.

  - result_id: R_PREVALENCE_cnv_chromosome
    question: For each chromosome with a non-trivial cohort-level CNV residual delta, what proportion of Responders vs Non-Responders carry the alteration (Q3 |residual| cutoff)?
    modality: scRNA-seq inferCNV residuals aggregated per patient × chromosome
    comparison: per-chromosome carrier fraction in Responders vs Non-Responders
    inputs:
      - data/processed/integrated_io_atlas_cnv.h5ad
      - out/05_multilayer/tables/patient_multilayer_features.csv
    sample_unit: patient
    statistical_method: descriptive carrier fraction; direction matched to cohort delta
    covariates: response
    multiple_testing: none — descriptive
    main_outputs:
      - out/05_multilayer/tables/cnv_chromosome_patient_prevalence.csv
      - out/05_multilayer/figures/05g_cnv_chr_prevalence.png
    qc_status: pending_run
    interpretation_status: pending
    strength_class: exploratory
    manuscript_priority: supplement
    figure_candidate: S_cnv_chr_prevalence
    caveats:
      - inferCNV residuals are noisy; per-chromosome aggregation reduces but does not eliminate variance.
      - With 7 R / 17 NR, fractions in the responder arm are quantised (1/7, 2/7, …) and should not be over-interpreted.

  - result_id: R_PREVALENCE_bulk_deconvolution
    question: For each major deconvolved cell type, what fraction of bulk samples are "high carriers" (≥Q3), and how do those samples differ on response, survival, or immune totals?
    modality: bulk RNA-seq deconvolution (IMbrave150, CheckMate459)
    comparison: carrier (≥Q3 fraction) vs other for the top deconvolved cell types
    inputs:
      - out/02c_bulk_deconvolution/tables/deconvolution_IMbrave150.csv
      - out/02c_bulk_deconvolution/tables/deconvolution_CheckMate459.csv
    sample_unit: patient
    statistical_method: quantile thresholding + Mann–Whitney U
    covariates: response, arm (when available), PFS/OS
    multiple_testing: none — descriptive overlay on existing trial-level analyses
    main_outputs:
      - out/02c_bulk_deconvolution/tables/02c_IMbrave150_prevalence.csv
      - out/02c_bulk_deconvolution/figures/02c_IMbrave150_prevalence.png
    qc_status: pending_run
    interpretation_status: pending
    strength_class: exploratory
    manuscript_priority: supplement
    figure_candidate: S_bulk_deconv_prevalence
    caveats:
      - NNLS deconvolution is a fallback; for production use the CIBERSORTx web service with the generated reference.
      - Carrier definition is cohort-relative (Q3) and does not map to an absolute clinical threshold.

